name: Build and Sign Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Environment Variables
        run: |
          for dir in . $(find . -type d -name "app" -exec dirname {} \;); do
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> "$dir/.env"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> "$dir/.env"
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> "$dir/.env"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> "$dir/.env"
            echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> "$dir/.env"
          done

      - name: Setup Keystore and Google Services
        run: |
          # Keystore decode
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > upload-key.jks
          cp upload-key.jks signing.keystore

          # Har app directory mein copy karo
          for appdir in $(find . -type d -name "app"); do
            cp upload-key.jks "$appdir/upload-key.jks"
            cp upload-key.jks "$appdir/signing.keystore"
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > "$appdir/google-services.json"
            fi
          done

          # Har folder jisme build.gradle hai wahan bhi copy karo
          for bdir in $(find . -name "build.gradle*" -exec dirname {} \;); do
            cp upload-key.jks "$bdir/upload-key.jks" 2>/dev/null || true
            cp upload-key.jks "$bdir/signing.keystore" 2>/dev/null || true
          done

      - name: Build Android App Bundle (AAB)
        run: |
          # Agar gradlew nahi hai to create karo
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sndmart-release-bundle
          path: "**/build/outputs/bundle/release/*.aab"
          
