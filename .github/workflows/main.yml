name: Build and Sign Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Environment Variables
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env

      - name: Restore and Distribute Keystore Everywhere
        run: |
          # Base64 decode karke root mein banayein
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > upload-key.jks
          
          # Sabhi zaroori jagah copy karein
          mkdir -p app
          cp upload-key.jks app/upload-key.jks
          cp upload-key.jks app/signing.keystore
          cp upload-key.jks signing.keystore

          # Agar subfolder hai to uske andar bhi daal dein
          find . -maxdepth 3 -type d -name "app" -exec cp upload-key.jks {}/upload-key.jks \;
          find . -maxdepth 3 -type d -name "app" -exec cp upload-key.jks {}/signing.keystore \;

      - name: Make Gradlew Executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android App Bundle (AAB)
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sndmart-release-bundle
          path: "**/build/outputs/bundle/release/*.aab"
          
