name: Build and Sign Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/signing.keystore

      - name: Create .env for build secrets
        run: |
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build Signed Android App Bundle (AAB) and APK
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/signing.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sndmart-release-bundle
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sndmart-release-apk
          path: app/build/outputs/apk/release/*.apk
