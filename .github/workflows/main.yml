name: Build and Sign Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore File
        run: |
          # signing.keystore ko upload-key.jks naam se copy kar do taaki gradle ko mil jaye
          find . -name "signing.keystore" -execdir cp signing.keystore upload-key.jks \; 2>/dev/null || true
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build Android App Bundle (AAB)
        working-directory: Snd-mart-new-customer-app
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sndmart-release-bundle
          path: "**/build/outputs/bundle/release/*.aab"
          
