name: Build and Sign Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Environment Variables
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env

      - name: Restore google-services.json
        run: |
          # Har app folder ke andar google-services.json create karein
          for d in $(find . -type d -name "app"); do
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > "$d/google-services.json"
          done

      - name: Restore and Copy Keystore Everywhere
        run: |
          # Decode keystore file
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > upload-key.jks
          
          # Root aur subfolders mein copies place karein
          cp upload-key.jks signing.keystore
          
          for d in $(find . -type d -name "app"); do
            cp upload-key.jks "$d/upload-key.jks"
            cp upload-key.jks "$d/signing.keystore"
          done

          find . -type f -name "build.gradle*" -exec dirname {} \; | while read dir; do
            cp upload-key.jks "$dir/upload-key.jks" 2>/dev/null || true
          done

      - name: Make Gradlew Executable
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build Android App Bundle (AAB)
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sndmart-release-bundle
          path: "**/build/outputs/bundle/release/*.aab"
          
