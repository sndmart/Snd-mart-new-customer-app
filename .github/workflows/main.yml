name: Build and Sign Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate Project and Setup Files
        run: |
          # Gradlew wali exact directory dhoondo
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          echo "Project directory: $GRADLE_DIR"
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

          # Inject environment variables into project root and app dir
          for d in "$GRADLE_DIR" "$GRADLE_DIR/app"; do
            mkdir -p "$d"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> "$d/.env"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> "$d/.env"
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> "$d/.env"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> "$d/.env"
            echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> "$d/.env"
          done

          # Place google-services.json wherever app folder exists
          find . -type d -name "app" | while read -r appdir; do
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > "$appdir/google-services.json"
          done

          # Decode keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > "$GRADLE_DIR/upload-key.jks"
          cp "$GRADLE_DIR/upload-key.jks" "$GRADLE_DIR/signing.keystore"

          # Distribute keystore into all subdirectories and app folders
          find . -type d -name "app" | while read -r appdir; do
            cp "$GRADLE_DIR/upload-key.jks" "$appdir/upload-key.jks"
            cp "$GRADLE_DIR/upload-key.jks" "$appdir/signing.keystore"
          done

          # Make gradlew executable
          chmod +x "$GRADLE_DIR/gradlew"

      - name: Build Android App Bundle (AAB)
        working-directory: ${{ env.GRADLE_DIR }}
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sndmart-release-bundle
          path: "**/build/outputs/bundle/release/*.aab"
          
