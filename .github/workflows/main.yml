name: Build and Sign Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore File
        run: |
          # signing.keystore ko upload-key.jks naam se copy karna
          find . -name "signing.keystore" -execdir cp signing.keystore upload-key.jks \; 2>/dev/null || true
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build Android App Bundle (AAB)
        run: |
          # gradlew jahan bhi hai uska directory path auto-detect karega
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "Error: gradlew file project me kahin nahi mili!"
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLE_PATH")
          echo "Found Gradle in directory: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sndmart-release-bundle
          path: "*/build/outputs/bundle/release/.aab"
